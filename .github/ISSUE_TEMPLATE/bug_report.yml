name: Bug report
description: Report something that is not working as expected.
title: '[Bug]: '
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting a bug, please include enough detail to reproduce the issue

    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: What went wrong?
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: Provide the smallest code sample or repository that reproduces the issue.
          placeholder: |
              ```ts
              import { volten } from "@volten/core";

              // ...
              ```
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: What actually happened? Include stack traces, WebGPU validation errors, or shader diagnostics if available.
      validations:
          required: true

    - type: input
      id: volten-version
      attributes:
          label: Volten version
          placeholder: 0.1.0
      validations:
          required: true

    - type: input
      id: runtime
      attributes:
          label: Runtime or browser
          description: For example Chrome, Edge, Node.js, Bun, Deno, or another WebGPU runtime.
          placeholder: Chrome 125
      validations:
          required: true

    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: Windows 11, macOS 15, Ubuntu 24.04
      validations:
          required: false

    - type: input
      id: gpu
      attributes:
          label: GPU or adapter
          description: Include this if known. It can help with WebGPU-specific behavior.
          placeholder: NVIDIA RTX 4070, Apple M3, Intel Iris Xe
      validations:
          required: false

    - type: textarea
      id: extra
      attributes:
          label: Additional context
          description: Anything else that may help diagnose the issue.
      validations:
          required: false

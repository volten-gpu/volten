name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm exec turbo run test

      - name: Smoke test package
        run: pnpm test:pack

      - name: Build website
        run: pnpm docs:build
